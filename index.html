<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>대한민국 인프라 소외지역 분석 지도</title>
  
  <!-- Leaflet CSS & JS 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster (핀 겹침 방지) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- iOS Glassmorphism 스타일시트 -->
  <link rel="stylesheet" href="css/style.css?v=20261026_1" />
  <meta name="typecast-api-key" content="__pltWiGzQz9EVYbCLVPmWzJjsp9uCP2oZavK39FztGL7">
</head>
<body>

  <div class="glass-phone-shell">
    <!-- 상단 헤더 -->
    <header class="glass-header">
      <div class="brand-ios">
        <div class="sf-icon">🛰️</div>
        <div class="brand-text">
          <h1>대한민국 인프라 소외지역 분석</h1>
          <p>초고화질 위성 한국어 지명 및 전국 18대 인프라 정밀 분석</p>
        </div>
      </div>

      <!-- 검색 도크 -->
      <div class="search-dock">
        <div class="search-glass-pill">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="searchInput" class="glass-input" placeholder="전국 모든 행정구역 검색 (예: 서울, 이천, 수원, 부산, 제주)..." autocomplete="off" oninput="handleSearchInput(event)" />
          <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
        <button class="ios-btn btn-apple-blue" onclick="executeSearchButton()">검색</button>
        <button class="ios-btn btn-apple-blue" onclick="openTutorial()">ℹ️ 사용방법</button>
        <button class="ios-btn btn-apple-success" onclick="openPresentationModal()">🎙️ 자동 발표</button>
      </div>
    </header>

    <!-- 실시간 상태 바 -->
    <div class="sync-status-bar">
      <span><span class="live-badge">LIVE</span> 인프라 트래픽 반영 중 (<span id="realtimeStreamStatus" style="color: #007aff; font-weight: 700;">전국 18대 인프라 스트림 통합</span>)</span>
      <span style="font-size: 11px; color: #515156;">다음 동기화: <b id="syncTimerText" style="color: var(--apple-blue);">10:00</b></span>
    </div>

    <!-- 모바일/태블릿 반응형 뷰 스위처 탭 바 (화면이 작을 때 자동 표시) -->
    <div class="mobile-view-tabs" id="mobileViewTabs">
      <button class="mobile-tab-btn active" id="tabMapBtn" onclick="switchMobileView('map')">🗺️ 지도 화면</button>
      <button class="mobile-tab-btn" id="tabPanelBtn" onclick="switchMobileView('panel')">📋 13대 진단 패널</button>
    </div>

    <!-- 메인 콘텐츠 레이아웃 (패널 좌측, 지도 우측) -->
    <div class="content-layout">
      <!-- 사이드바 래퍼 (사이드바와 우측 플로팅 접기 핸들 일체형 컨테이너) -->
      <div class="sidebar-wrapper" id="sidebarWrapper">
        <!-- 소외지역 항목 패널 (좌측) -->
        <aside class="category-item-sidebar" id="categoryItemSidebar">
          <div class="sidebar-title">📋 소외지역 항목 패널</div>
          <div style="font-size: 12px; color: #86868b; padding: 10px; text-align: center;">
            전체 보기 또는 카테고리를 선택하면<br>해당 소외지역 항목들이 표시됩니다.
          </div>
        </aside>

        <!-- 패널 접기/펼치기 플로팅 핸들 버튼 (사이드바 우측 바깥 경계에 100% 정확히 밀착) -->
        <button class="panel-toggle-btn" id="panelToggleBtn" onclick="toggleSidebarPanel()" title="패널 접기 / 펼치기">
          <span id="panelToggleIcon">◀</span>
        </button>
      </div>

      <!-- 지도 영역 (우측 메인) -->
      <div class="map-wrapper">
        <!-- 지도 상단 인프라 분석 레이어 빠른 ON/OFF 토글 바 -->
        <div class="map-quick-toggles">
          <button class="layer-toggle-btn active" data-layer="emergency" onclick="toggleOverlayLayer('emergency')"><span class="toggle-dot"></span>🚨 응급사각 (30km)</button>
          <button class="layer-toggle-btn active" data-layer="extinction" onclick="toggleOverlayLayer('extinction')"><span class="toggle-dot"></span>📉 소멸위험</button>
          <button class="layer-toggle-btn" data-layer="maternal" onclick="toggleOverlayLayer('maternal')"><span class="toggle-dot"></span>👶 분만공백</button>
          <button class="layer-toggle-btn" data-layer="transit" onclick="toggleOverlayLayer('transit')"><span class="toggle-dot"></span>🚆 교통단절</button>
          <button class="layer-toggle-btn" data-layer="energy" onclick="toggleOverlayLayer('energy')"><span class="toggle-dot"></span>⚡ 에너지소외</button>
          <button class="layer-toggle-btn" data-layer="banking" onclick="toggleOverlayLayer('banking')"><span class="toggle-dot"></span>🏦 금융소외</button>
        </div>
        <!-- 실시간 지도 반영 알림 토스트 배너 -->
        <div id="liveMapToast" class="live-map-toast"></div>
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- ⚠️ 검색 오류 / 결과 없음 커스텀 알림 모달 UI -->
  <div id="searchAlertModal" class="modal-overlay" onclick="closeSearchAlertOnBackdrop(event)">
    <div class="alert-modal-window">
      <div class="alert-icon-badge" id="searchAlertIcon">🔍</div>
      <h3 class="alert-title" id="searchAlertTitle">검색 결과가 없습니다</h3>
      <p class="alert-message" id="searchAlertMessage"></p>
      <div class="alert-suggestions" id="searchAlertSuggestions"></div>
      <div class="alert-actions">
        <button class="ios-btn btn-apple-blue" style="width: 100%; justify-content: center;" onclick="closeSearchAlert()">확인</button>
      </div>
    </div>
  </div>

  <!-- 📖 튜토리얼 (사용방법 안내) 모달 -->
  <!-- Presentation Modal (PPT 연동 15분 Typecast AI 자동 발표 모달) -->
  <div id="presentationModalOverlay" class="modal-overlay" onclick="closeModalOnBackdrop(event, 'presentationModalOverlay')">
    <div class="modal-window" style="max-width: 780px; width: 94%;">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:20px;">🎙️</span>
          <div>
            <span class="modal-title" style="font-size:16.5px; font-weight:700;">PPT 연동 15분 Typecast AI 자동 발표</span>
            <div style="font-size:11px; color:#007aff; font-weight:600;">Typecast ssfm-v30 고음질 AI 성우 엔진 탑재</div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button id="presentationPipBtn" class="ios-btn tutorial-nav-btn" style="font-size:11px; padding:4px 8px;" onclick="togglePresentationPipMode()" title="지도를 보면서 슬라이드를 우측 하단 미니창으로 시청">🗺️ 지도 동시 보기</button>
          <button class="ios-btn btn-apple-blue" style="font-size:11px; padding:4px 8px;" onclick="downloadPresentationPPT()" title="공식 파워포인트(PPTX) 파일 다운로드">📥 PPT 다운로드</button>
          <span id="presentationProgress" style="font-size:11.5px; color:#007aff; font-weight:700; background:rgba(0,122,255,0.1); padding:3px 8px; border-radius:12px;">1 / 8</span>
          <button class="modal-close" onclick="closePresentationModal()">&times;</button>
        </div>
      </div>

      <!-- 슬라이드 및 오디오 프로그레스 바 -->
      <div style="height: 4px; background: rgba(0,0,0,0.06); width: 100%; position: relative;">
        <div id="presentationProgressBar" style="height: 100%; width: 12.5%; background: #007aff; transition: width 0.3s ease;"></div>
      </div>

      <div class="modal-body" style="padding: 14px 18px;">
        <!-- 🖥️ 16:9 와이드스크린 실제 PPT 슬라이드 화면 뷰어 -->
        <div id="pptSlideViewer" class="ppt-slide-canvas"></div>

        <!-- 실시간 AI 음성 자막 싱크 박스 -->
        <div id="presentationCaption" style="font-size:12.5px; line-height:1.6; color:#3a3a3c; background:#f8fafc; border-radius:10px; padding:10px 14px; margin-top:6px; border:1px solid #e2e8f0; max-height: 120px; overflow-y: auto;"></div>
        
        <!-- 실시간 재생 상태 및 오디오 시간 -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px;">
          <div id="presentationStatus" style="color:#007aff; font-weight:600; display:flex; align-items:center; gap:6px;"></div>
          <div id="presentationTimeStatus" style="color:#86868b; font-weight:600; font-variant-numeric: tabular-nums;">00:00 / 15:00</div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; border-top:1px solid #f2f2f7; padding-top:10px; gap:8px; flex-wrap:wrap;">
          <div style="display:flex; gap:6px;">
            <button class="ios-btn tutorial-nav-btn" onclick="prevPresentationSlide()">◀ 이전 슬라이드</button>
            <button class="ios-btn tutorial-nav-btn" onclick="nextPresentationSlide()">다음 슬라이드 ▶</button>
          </div>
          <div style="display:flex; gap:6px;">
            <button id="presentationMuteBtn" class="ios-btn tutorial-nav-btn" onclick="togglePresentationAudio()">🔊 음성 켜짐</button>
            <button id="autoPresentationToggleBtn" class="ios-btn btn-apple-success" onclick="toggleAutoPresentation()">▶️ 자동 발표 시작</button>
          </div>
        </div>
      </div>
    </div>
  </div>
<div id="tutorialModalOverlay" class="modal-overlay" onclick="closeTutorialOnBackdrop(event)">
    <div class="tutorial-window" id="tutCard">
      <!-- 헤더 -->
      <div class="tutorial-header">
        <span class="tutorial-header-title">📖 사용 가이드</span>
        <span class="tutorial-progress" id="tutProgress">1 / 10</span>
        <button class="modal-close" onclick="closeTutorial()">&times;</button>
      </div>
      <!-- 프로그레스 바 -->
      <div class="tutorial-progress-track">
        <div class="tutorial-progress-bar" id="tutProgressBar" style="width: 10%;"></div>
      </div>
      <!-- 본문 -->
      <div class="tutorial-body">
        <div class="tutorial-icon-badge" id="tutStepIcon">👋</div>
        <h3 class="tutorial-step-title" id="tutStepTitle"></h3>
        <p class="tutorial-step-desc" id="tutStepDesc"></p>
      </div>
      <!-- 네비게이션 -->
      <div class="tutorial-nav">
        <button class="ios-btn tutorial-nav-btn" id="tutPrevBtn" onclick="tutorialPrev()">◀ 이전</button>
        <button class="ios-btn btn-apple-blue tutorial-nav-btn" id="tutNextBtn" onclick="tutorialNext()">다음 ▶</button>
      </div>
    </div>
  </div>

  <!-- 기능별 분리된 자바스크립트 파일들 -->
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/search.js"></script>
  <script src="js/tts_demo.js?v=20261026_15min"></script>
  <script src="js/presentation.js?v=20261026_15min"></script>
  <script src="js/modal.js?v=20261026_15min"></script>
  <script src="js/timer.js"></script>
  <script src="js/tutorial.js?v=20261018_2"></script>
  <script src="js/app.js"></script>
</body>
</html>
